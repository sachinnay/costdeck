---

name: Helm Charts Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version, for example 1.8.0"
        required: true
        type: string

permissions:
  contents: read

run-name: ${{ github.repository }} Release ${{ github.event.inputs.release }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE: ${{ inputs.release }}
  CHART_DIR: deploy/helm/costdeck-operator

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$RELEASE' is not a semantic version"; exit 1; }
      - name: Check if tag exists
        uses: netcracker/qubership-workflow-hub/actions/tag-action@cf536587a99a23b3614aa4db4bdbf13cf36059b6 # v2.8.3
        with:
          tag-name: ${{ inputs.release }}
          ref: ${{ github.ref }}
          create-tag: false
          check-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  load-docker-build-components:
    needs: [check-tag]
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.load_component.outputs.components }}
      platforms: ${{ steps.load_component.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load Docker Configuration
        id: load_component
        run: |
          config=.github/docker-build-config.json
          if jq -e '(.components | type == "array") and all(.components[]; has("name") and has("file") and has("context")) and (.platforms | type == "string")' "$config" > /dev/null; then
            echo "$config is valid"
          else
            echo "::error::$config is invalid"
            exit 1
          fi
          echo "components=$(jq -c .components "$config")" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -r .platforms "$config")" >> "$GITHUB_OUTPUT"

  docker-check-build:
    needs: [load-docker-build-components]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.load-docker-build-components.outputs.component) }}
    steps:
      - name: Docker build (dry run)
        uses: netcracker/qubership-workflow-hub/actions/docker-action@cf536587a99a23b3614aa4db4bdbf13cf36059b6 # v2.8.3
        with:
          ref: ${{ github.ref }}
          download-artifact: false
          dry-run: true
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ needs.load-docker-build-components.outputs.platforms }}
          tags: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  chart-release-prepare:
    needs: [docker-check-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update versions in the chart and push the release branch
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          owner=${OWNER,,}
          sed -i -E "s|^version: .*|version: ${RELEASE}|; s|^appVersion: .*|appVersion: \"${RELEASE}\"|" "$CHART_DIR/Chart.yaml"
          sed -i -E "s|^( *repository: ).*|\1ghcr.io/${owner}/costdeck-operator|; s|^( *tag: ).*|\1\"${RELEASE}\"|" "$CHART_DIR/values.yaml"
          sed -i -E "s|^( *version: )\".*\"|\1\"${RELEASE}\"|" internal/api/openapi.yaml
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git checkout -b "release-${RELEASE}"
          git commit -am "chore(release): ${RELEASE}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "release-${RELEASE}"

  docker-build:
    needs: [chart-release-prepare, load-docker-build-components]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.load-docker-build-components.outputs.component) }}
    steps:
      - name: Docker build
        uses: netcracker/qubership-workflow-hub/actions/docker-action@cf536587a99a23b3614aa4db4bdbf13cf36059b6 # v2.8.3
        with:
          ref: release-${{ inputs.release }}
          download-artifact: false
          dry-run: false
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ needs.load-docker-build-components.outputs.platforms }}
          tags: ${{ inputs.release }},latest
          build-args: VERSION=${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  charts-release:
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: release-${{ inputs.release }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Package and push chart
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=${OWNER,,}
          mkdir -p .cr-release-packages
          helm package "$CHART_DIR" --destination .cr-release-packages
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push ".cr-release-packages/costdeck-operator-${RELEASE}.tgz" "oci://ghcr.io/${owner}/charts"
      - name: Build install bundle
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=${OWNER,,}
          make build-installer IMG="ghcr.io/${owner}/costdeck-operator:${RELEASE}"
          cp dist/install.yaml .cr-release-packages/install.yaml
      - name: Release-drafter
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619 # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: true
          name: ${{ inputs.release }}
          tag: ${{ inputs.release }}
          version: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Assets
        uses: netcracker/qubership-workflow-hub/actions/assets-action@cf536587a99a23b3614aa4db4bdbf13cf36059b6 # v2.8.3
        with:
          tag: ${{ inputs.release }}
          item-path: .cr-release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
