---
name: CLA Assistant
on:
  # pull_request_target is required so the CLA check also works for pull requests
  # from forks. The workflow only runs the pinned contributor-assistant action;
  # it never checks out or runs code from the pull request head.
  # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  CLAAssistant:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # The standard Netcracker CLA assistant, pinned by commit SHA. Its upstream
        # repository is archived, but the pinned commit is what the Netcracker
        # open-source process uses.
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Netcracker/qubership-github-workflows/blob/main/CLA/cla.md'
          # branch should not be protected
          branch: 'main'
          allowlist: NetcrackerCLPLCI,web-flow,bot*
          remote-repository-name: cla-storage
          remote-organization-name: Netcracker
